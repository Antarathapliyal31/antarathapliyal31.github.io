name: Deploy site

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build and deploy
        uses: shalzz/zola-deploy-action@v0.23.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}